<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Inkwell Notes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkwell">
<meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13171e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600&display=swap">
<style>
/* base reset */
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
#library{padding-top:calc(28px + env(safe-area-inset-top,0px))!important;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))!important}

/* Layout: library grid of notebook covers → full-screen canvas editor with a floating tool rail and pop-out tool settings */
:root{
  --bg:#eceff4; --desk:#e3e7ee; --panel:#ffffff; --panel2:#f3f5f8; --ink:#18202c; --muted:#677285;
  --line:#d9dee7; --accent:#2c56c9; --accent-soft:#e2e9fa; --danger:#c0392f; --shadow:rgba(24,34,52,.12);
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Onest", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171e; --desk:#0f1318; --panel:#1c222c; --panel2:#232a35; --ink:#e6eaf0; --muted:#8a94a4;
  --line:#2a323e; --accent:#7f9df2; --accent-soft:#232e47; --danger:#ef6b5f; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171e; --desk:#0f1318; --panel:#1c222c; --panel2:#232a35; --ink:#e6eaf0; --muted:#8a94a4;
  --line:#2a323e; --accent:#7f9df2; --accent-soft:#232e47; --danger:#ef6b5f; --shadow:rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- Library ---------- */
#library{min-height:100%;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:28px 48px;max-width:1180px;margin:0 auto;box-sizing:border-box}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.lib-head h1{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.02em;margin:0;line-height:1}
.lib-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 22px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.cover{aspect-ratio:3/4;max-width:100%;border-radius:6px 12px 12px 6px;background:var(--panel);overflow:hidden;position:relative;box-shadow:0 1px 2px var(--shadow),0 8px 22px -10px var(--shadow);transition:transform .15s}
.cover img{width:100%;height:100%;object-fit:contain;display:block;background:#fbfbf8}
.cover.nb::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--spine,#2c56c9);opacity:.9;z-index:1}
.card button.open:active .cover{transform:scale(.97)}
.card button.open{display:block;text-align:left;width:100%}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.meta .t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.meta .d{color:var(--muted);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.more{color:var(--muted);border-radius:8px;padding:2px;flex:none}
.more:hover{background:var(--accent-soft)}
.create .cover{display:grid;place-items:center;background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.plus{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--accent)}
.plus svg{stroke:#fff;width:26px;height:26px}

/* popovers & sheets */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -12px var(--shadow);padding:6px;min-width:200px}
.pop button.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:9px;text-align:left;font-size:15px}
.pop button.row:hover{background:var(--accent-soft)}
.pop button.row small{display:block;color:var(--muted);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.pop .danger{color:var(--danger)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,22,.28)}
.sheet{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));background:var(--panel);border-radius:18px;padding:22px;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em}
.sheet label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px}
.papers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.papers button{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.papers button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.papers canvas{width:44px;height:56px;border-radius:3px;background:#fbfbf8}
.spines{display:flex;gap:10px;margin-top:8px}
.spines button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--panel)}
.spines button[aria-pressed="true"]{border-color:var(--ink)}
.actions{display:flex;justify-content:flex-end;gap:10px}
.btn{padding:10px 18px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{color:var(--muted)}
.btn.warn{color:var(--danger);background:transparent;border:1px solid var(--line)}
.btn.warn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ---------- tool settings panel ---------- */
.tset{width:min(330px,calc(100vw - 24px));box-sizing:border-box;padding:14px 16px 16px;border-radius:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow-y:auto;background:var(--panel2)}
.tset-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tset-head h3{margin:0;font-size:16px;font-weight:600;text-align:center}
.pill{justify-self:start;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--accent);font-weight:500;font-size:14px}
.tprev{width:100%;height:84px;background:#efefec;border-radius:12px;display:block}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl-top{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.ctl-top b{font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.ctl-top small{color:var(--muted);font-size:12px;margin-left:6px}
.pm{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:16px;line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;--v:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--v),var(--line) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-11px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--v),var(--line) var(--v))}
input[type=range]::-moz-range-thumb{width:46px;height:28px;border-radius:14px;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{height:40px;border-radius:12px;background:var(--panel);border:1.5px solid transparent;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg svg{width:60px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tset hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.pal-head{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.rainbow{width:28px;height:28px;border-radius:50%;background:conic-gradient(#f44,#fd3,#4d4,#3df,#44f,#e4e,#f44);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;justify-items:center}
.pal button{width:40px;height:40px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);position:relative}
.pal button[aria-pressed="true"]::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2.5px solid var(--panel2)}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.pal .addc{background:var(--line);display:grid;place-items:center;font-size:22px;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
/* color picker */
.picker{width:min(320px,calc(100vw - 24px));box-sizing:border-box;padding:16px;border-radius:20px;display:flex;flex-direction:column;gap:14px;z-index:55;background:var(--panel2)}
.picker h3{margin:0;text-align:center;font-size:16px;font-weight:600}
.sv{width:100%;height:170px;border-radius:12px;display:block;touch-action:none}
.hue{width:100%;height:28px;border-radius:14px;display:block;touch-action:none}
.hexrow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:8px}
.hexrow .sw0{width:40px;height:40px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.hexrow input{flex:1;min-width:0;font:inherit;font-size:16px;border:0;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.hexrow .add{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:22px;display:grid;place-items:center;flex:none}

/* ---------- Editor ---------- */
#editor{position:fixed;inset:0;background:var(--desk);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#live{touch-action:none}
#file{position:fixed;left:50%;top:40%;width:48px;height:48px;border-radius:12px;opacity:0;pointer-events:none;z-index:-1}
#ted{position:absolute;z-index:4;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);outline-offset:6px;border-radius:2px;background:transparent;resize:none;overflow:hidden;line-height:1.3;font-family:var(--f-body);white-space:pre-wrap;transform-origin:0 0;user-select:text;-webkit-user-select:text}
.topbar{position:absolute;z-index:5;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;pointer-events:none;flex-wrap:wrap}
.bar{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 6px 20px -10px var(--shadow)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink);position:relative}
.ib:hover{background:var(--accent-soft)}
.ib[disabled]{opacity:.3;pointer-events:none}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib .dot{position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px var(--panel)}
.title-in{font:inherit;font-weight:600;font-size:15px;border:0;background:transparent;color:var(--ink);padding:8px 8px;border-radius:8px;width:clamp(110px,22vw,260px);min-width:0}
.title-in:focus{background:var(--bg);outline:none}
.pageno{font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;color:var(--muted);min-width:54px;text-align:center}
.spacer{flex:1}
.chip{font-size:12px;font-weight:600;padding:0 10px;height:30px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}

.rail{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 10px 30px -14px var(--shadow);max-height:calc(100% - 130px);overflow-y:auto}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.sw{width:40px;height:30px;display:grid;place-items:center;border-radius:10px;flex:none}
.sw span{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.14)}
.sw[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c),inset 0 0 0 1.5px rgba(0,0,0,.14)}
.ctx{position:absolute;z-index:6;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 10px 30px -14px var(--shadow);max-width:calc(100% - 32px);overflow-x:auto}
.ctx.near{bottom:auto;transform:translateX(-50%);padding:3px;border-radius:10px;gap:2px}
.ctx.near button{padding:6px 10px;font-size:13px}
.ctx button{padding:8px 13px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.ctx button:hover{background:var(--accent-soft)}
.ctx .del{color:var(--danger)}
.toast{position:fixed;z-index:80;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
@media (max-width:640px){
  .rail{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:none;flex-direction:row;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-height:none;overflow-x:auto}
  .rail hr{border-top:0;border-left:1px solid var(--line);margin:6px 4px}
  .ctx{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .ctx.near{bottom:auto}
  .lib-head h1{font-size:28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="library">
  <div class="lib-head">
    <div><h1>Notes</h1><p id="count">Saved on this device</p></div>
    <div class="tabs" id="tabs">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="notebook" aria-pressed="false">Notebooks</button>
      <button data-f="board" aria-pressed="false">Whiteboards</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="editor" hidden>
  <div id="stage"><canvas id="base"></canvas><canvas id="live"></canvas></div>
  <textarea id="ted" spellcheck="false" hidden></textarea>
  <div class="topbar">
    <div class="bar">
      <button class="ib" id="back" aria-label="Back to library"></button>
      <input class="title-in" id="title" type="text" aria-label="Title" spellcheck="false">
    </div>
    <div class="bar">
      <button class="ib" id="undo" aria-label="Undo"></button>
      <button class="ib" id="redo" aria-label="Redo"></button>
    </div>
    <div class="spacer"></div>
    <div class="bar" id="pagebar">
      <button class="ib" id="prev" aria-label="Previous page"></button>
      <span class="pageno" id="pageno">1 / 1</span>
      <button class="ib" id="next" aria-label="Next page"></button>
      <button class="ib" id="addpage" aria-label="Add page"></button>
    </div>
    <div class="bar">
      <button class="chip" id="pencilonly" aria-pressed="false" title="When on, fingers move the page and only Apple Pencil draws">Pencil only</button>
      <button class="ib" id="paperbtn" aria-label="Paper style"></button>
      <button class="ib" id="fit" aria-label="Fit to screen"></button>
      <button class="ib" id="emore" aria-label="More"></button>
    </div>
  </div>
  <div class="rail" id="rail"></div>
  <div class="ctx" id="ctx" hidden></div>
</div>
<input type="file" id="file" accept="image/*" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';
/* ================= constants ================= */
const PAGE = { w: 1000, h: 1414 };
const GAP = 0, STRIDE = PAGE.h + GAP;   // notebook pages are stacked vertically, scrolled like a book
const PAPER = '#fbfbf8';
const SPINES = ['#2c56c9', '#1d8a58', '#c0532f', '#7c4dc4', '#3a4352', '#c99a1d'];
const PAPERS = [['blank', 'Blank'], ['lines', 'Lines'], ['grid', 'Grid'], ['dots', 'Dots']];
const BASE_PALETTE = ['#111418', '#e5484d', '#3b7bea', '#1d8a58', '#f5c84c', '#ffffff', '#a9cdee', '#f2bccb', '#93b39b', '#c9c0f5', '#f08c3c'];
const DEFAULTS = {
  fountain: { stab: 1, tip: .6, sens: .4, size: 1.2, op: 1, color: '#111418' },
  ball: { stab: 1, size: .8, op: 1, style: 'solid', color: '#3b7bea' },
  hl: { size: 1, op: .4, straight: false, color: '#f5c84c' },
  eraser: { mode: 'stroke', size: 2 },
  text: { size: 28, color: '#111418' }
};
const TOOL_NAMES = { fountain: 'Fountain pen', ball: 'Ballpoint pen', hl: 'Highlighter', eraser: 'Eraser', lasso: 'Lasso', text: 'Text', hand: 'Move canvas', image: 'Image', bucket: 'Fill bucket' };

const I = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  undo: '<path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/>',
  redo: '<path d="M15 6l5 5-5 5"/><path d="M20 11H10a5 5 0 0 0 0 10h3"/>',
  prev: '<path d="M14 6l-6 6 6 6"/>', next: '<path d="M10 6l6 6-6 6"/>',
  addpage: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
  paper: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  fit: '<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',

    c.stroke();

function pickImage(asNew, keepPlace) { if (!keepPlace) { pendingPlace = null; const f0 = $('#file'); f0.style.left = '50%'; f0.style.top = '40%'; } pendingNewFromPhoto = asNew; const f = $('#file'); f.value = ''; f.click(); }

/* ================= examples on first run ================= */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const F = (color, w, pts, extra) => Object.assign({ tool: 'fountain', color, w, op: 1, tip: .35, sens: .35, pts }, extra || {});
function scribble(x0, y, xEnd, r, color = '#111418', w = 3, amp = 11) {
  const out = []; let x = x0;
  while (x < xEnd - 30) {
    const wl = Math.min(xEnd - x, 36 + r() * 92), pts = [], ph = r() * 3, a = amp * (.75 + r() * .35);
    for (let t = 0; t <= wl; t += 3) {

const lineSt = (pts, color, w, tool = 'fountain', extra) => (tool === 'hl' ? { tool: 'hl', color, w, op: .4, pts: pts.flatMap(([x, y]) => [x, y, .5]) } : F(color, w, pts.flatMap(([x, y]) => [x, y, .55]), Object.assign({ tip: .15, sens: .2 }, extra)));

  const p = []; for (let t = 0; t <= 1; t += .05) p.push([x + w * t, y + Math.sin(t * 7) * r]);
  for (let t = 0; t <= 1; t += .05) p.push([x + w + Math.sin(t * 6) * r, y + h * t]);
  for (let t = 0; t <= 1; t += .05) p.push([x + w - w * t, y + h + Math.sin(t * 5) * r]);

}
function seed() {
  const r = rng(7);
  const nb = blankNote('notebook', 'Example · Shoot plan', 'lines', SPINES[0]);
  const pg = nb.pages[0], s = pg.strokes;
  pg.texts.push({ id: uid(), x: 150, y: 70, w: 700, size: 40, color: '#111418', text: 'Shoot plan · Saturday' });
  s.push(lineSt([[148, 128], [400, 124], [560, 129]], '#3b7bea', 4));
  s.push(lineSt([[146, 255], [700, 255]], '#f5c84c', 26, 'hl'));
  for (let i = 0; i < 6; i++) s.push(...scribble(150, 211 + i * 44, 860 - r() * 260, r));
  for (let i = 0; i < 4; i++) {
    const y = 563 + i * 44;
    s.push(lineSt(rectPts(150, y - 26, 22, 22, .8), '#111418', 2.4));
    if (i < 2) s.push(lineSt([[153, y - 14], [160, y - 6], [176, y - 30]], '#1d8a58', 3.4));
    s.push(...scribble(195, y, 560 + r() * 250, r));
  }
  const cp = []; for (let t = 0; t <= 6.6; t += .15) cp.push([760 + Math.cos(t) * 120, 900 + Math.sin(t) * 46]);
  s.push(lineSt(cp, '#e5484d', 3)); s.push(...scribble(680, 914, 840, r, '#e5484d', 2.8));
  for (let i = 0; i < 3; i++) s.push(...scribble(150, 1047 + i * 44, 820 - r() * 300, r));
  nb.pages.push(blankPage());
  nb.updated = Date.now() - 3600e3;

  const bd = blankNote('board', 'Example · Ideas board', 'dots', SPINES[0]);
  const b = bd.pages[0].strokes, R = rng(11);
  const boxes = [[0, 0, '#3b7bea', 'Hook'], [420, -60, '#1d8a58', 'Story'], [420, 200, '#e5484d', 'B-roll'], [840, 70, '#7c4dc4', 'Call to action']];
  for (const [x, y, c, label] of boxes) { b.push(lineSt(rectPts(x, y, 300, 170, 2), c, 3.4)); bd.pages[0].texts.push({ id: uid(), x: x + 28, y: y + 26, w: 250, size: 30, color: '#111418', text: label }); b.push(...scribble(x + 30, y + 125, x + 230, R, '#677285', 2.4, 10)); }
  const arrow = (x1, y1, x2, y2) => { b.push(lineSt([[x1, y1], [(x1 + x2) / 2, (y1 + y2) / 2 - 12], [x2, y2]], '#111418', 2.8)); const a = Math.atan2(y2 - y1, x2 - x1); b.push(lineSt([[x2 - 22 * Math.cos(a - .45), y2 - 22 * Math.sin(a - .45)], [x2, y2], [x2 - 22 * Math.cos(a + .45), y2 - 22 * Math.sin(a + .45)]], '#111418', 2.8)); };
